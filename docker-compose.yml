services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
      - rag-data:/app/data
    environment:
      - PROJECT_NAME=standard-rag
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-6}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  rag-data:
  frontend-node-modules:
